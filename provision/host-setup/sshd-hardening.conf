# Ops host SSH hardening (0H) — installed to
# /etc/ssh/sshd_config.d/10-ops-hardening.conf by harden.sh
#
# TcpForwarding is left ENABLED on purpose — pgAdmin / psql reach Postgres
# over an SSH tunnel. Revisit if that stops being true.

PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes

MaxAuthTries 3
LoginGraceTime 30
MaxSessions 10

X11Forwarding no
PermitEmptyPasswords no
