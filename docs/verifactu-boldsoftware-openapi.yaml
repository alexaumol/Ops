  /invoice_cancel:
    post:
      tags:
      - Facturas
      summary: Anular una factura
      operationId: cancelInvoice
      description: |
        Anula una factura previamente emitida, identificada por su `queueId`.

        El cuerpo de la petición se interpreta como JSON: el valor decodificado debe ser el número
        de `queueId` sin más envoltorio (no un objeto ni un array). Un valor con ceros a la izquierda
        (p.ej. `0044`) no es JSON numérico válido y se rechaza como JSON mal formado, con una forma de
        respuesta distinta a la habitual (ver nota al final).

        La respuesta 200 de esta operación **no incluye el campo `qrcode`** (a diferencia de la
        respuesta de creación de factura): la anulación no genera código QR.

        No se exige ningún estado previo de tramitación ante la AEAT para poder anular: solo se
        bloquea si el `queueId` no existe (o no pertenece a la compañía autenticada), si ya fue
        anulado, o si el `queueId` indicado corresponde en sí mismo a una anulación.

        ### Catálogo de códigos de error de negocio (HTTP 400)

        | code | Causa |
        |------|-------|
        | `000100` | Se encontró más de un registro coincidente con ese `queueId` (dato inconsistente). |
        | `000101` | El `queueId` no existe, o pertenece a otra compañía (mismo código en ambos casos, para no filtrar información). |
        | `000102` / `000103` | El `queueId` ya fue anulado previamente, o corresponde a una anulación (no a una factura original). |

        Nota: si el cuerpo de la petición no es JSON sintácticamente válido, la respuesta 400 no sigue
        el schema `Error` habitual: es `{"error": "invalid_json", "message": "..."}`, sin `code` ni
        `requestId`.
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              pattern: ^[0-9]+$
              description: Identificador (queueId) de la factura a anular
            example: '44'
      responses:
        '200':
          description: Anulación aceptada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatosVerifactu'
              example:
                qrcode: ''
                chainInfo:
                  issuerIrsId: B13674197
                  number: A-000001
                  issuedTime: '2025-07-21T00:00:00+02:00'
                  hash: 1B345A165A7F99610AD75B135C8DCDE197AD353BD6E840E53733FD66C5B76264
                verifactuXml: PHN1bTE6UmVnaXN0cm9BbHRhIHhtbG5zOnN1bTE9Imh0dHBzOi8vd3d3Mi5hZ2VuY2lhdHJpYnV0YXJpYS5nb2IuZXMv...
                verifactuUrl: ''
                queueId: '44'
                requestId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        '400':
          description: Solicitud incorrecta o error de negocio (ver catálogo de códigos arriba, en la descripción de la operación)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Register does not exist.
                code: '000101'
                requestId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        '404':
          description: Verbo HTTP no soportado en esta ruta (solo se admite POST). Respuesta sin cuerpo.
        '503':
          description: Servicio no disponible temporalmente (mantenimiento) o error de conexión/concurrencia en base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /invoice_state/{id}:
    post:
      tags:
      - Facturas
      summary: Consultar estado de una factura
      operationId: getInvoiceState
      description: |
        Obtiene el estado de tramitación de una factura por su identificador (queueId).

        Este endpoint informa **solo del estado**, no de los datos originales de la factura (para
        recuperarlos, ver `POST /invoice_data/{id}`). Si el `queueId` no existe, o pertenece a otra
        compañía, ambos casos devuelven el mismo error (`520682`), sin distinción.

        Actualmente `state` nunca toma el valor `cancel`: anular una factura no modifica el estado de
        la factura original consultada por este endpoint (la anulación tiene su propio `queueId` e
        historial independiente). Cualquier valor interno no reconocido explícitamente se reporta como
        `pending`.

        ### Catálogo de códigos de error de negocio (HTTP 400)

        | code | Causa |
        |------|-------|
        | `520680` | El `id` de la ruta no es un entero válido. |
        | `520681` | El `id` es un entero pero menor que 1. |
        | `520682` | No existe una factura con ese `queueId` para la compañía autenticada. |
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        description: queueId de la factura
        example: 44
      responses:
        '200':
          description: Estado recuperado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoFactura'
              example:
                state: sent
                requestId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        '400':
          description: Solicitud incorrecta o error de negocio (ver catálogo de códigos arriba, en la descripción de la operación)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invoice not found.
                code: '520682'
                requestId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        '404':
          description: Verbo HTTP no soportado en esta ruta (solo se admite POST). Respuesta sin cuerpo.
        '503':
          description: Servicio no disponible temporalmente (mantenimiento) o error de conexión/concurrencia en base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /invoice_data/{id}:
    post:
      tags:
      - Facturas
      summary: Recuperar los datos originales de una factura
      operationId: getInvoiceData
      description: |
        Devuelve los mismos datos que se entregaron en la respuesta original de creación o anulación
        de la factura (código QR, XML, hash de encadenamiento, URL de verificación), identificada por
        su `queueId`. Es útil para recuperar esa respuesta si no se guardó en el momento de la petición
        original.

        Este endpoint **no informa del estado de tramitación** ante la AEAT (para eso, usar
        `POST /invoice_state/{id}`): siempre devuelve los mismos datos, generados en el momento de la
        creación/anulación, con independencia de lo que haya ocurrido después con esa factura.

        Si el `queueId` consultado corresponde a una anulación (no a una emisión original), `qrcode` y
        `verifactuUrl` se devuelven como cadena vacía `""` (no ausentes, no `null`): una anulación no
        genera código QR propio.

        Si el `queueId` no existe, o pertenece a otra compañía, ambos casos devuelven el mismo error
        (`151212`), sin distinción.

        ### Catálogo de códigos de error de negocio (HTTP 400)

        | code | Causa |
        |------|-------|
        | `151210` | El `id` de la ruta no es un entero válido. |
        | `151211` | El `id` es un entero pero menor que 1. |
        | `151212` | No existe una factura con ese `queueId` para la compañía autenticada. |
      security:
      - ApiKeyAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
        description: queueId de la factura
        example: 44
      responses:
        '200':
          description: Datos originales recuperados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDataResponse'
              example:
                qrcode: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAAB4CAYAAAAoaKA8AAAAAXNSR0IArs4c6QAAAARnQU1BAAC...
                chainInfo:
                  issuerIrsId: B13674197
                  number: A-000001
                  issuedTime: '2025-07-21T00:00:00+02:00'
                  hash: 1B345A165A7F99610AD75B135C8DCDE197AD353BD6E840E53733FD66C5B76264
                verifactuXml: PHN1bTE6UmVnaXN0cm9BbHRhIHhtbG5zOnN1bTE9Imh0dHBzOi8vd3d3Mi5hZ2VuY2lhdHJpYnV0YXJpYS5nb2IuZXMv...
                verifactuUrl: https://prewww2.aeat.es/wlpl/TIKE-CONT/ValidarQR?nif=B13674197&numserie=A-000001&fecha=21-07-2025&importe=12.10
                queueId: 44
                requestId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                originalRequestId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        '400':
          description: Solicitud incorrecta o error de negocio (ver catálogo de códigos arriba, en la descripción de la operación)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invoice not found.
                code: '151212'
                requestId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        '404':
          description: Verbo HTTP no soportado en esta ruta (solo se admite POST). Respuesta sin cuerpo.
        '503':
          description: Servicio no disponible temporalmente (mantenimiento) o error de conexión/concurrencia en base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
  /id_check:
    post:
      tags:
        - Utilidades
      summary: Verificar NIF/NIE y nombre o razón social
      operationId: checkId
      description: |
        Este endpoint contrasta el par NIF/NIE y nombre o razón social con el servicio de la AEAT
        habilitado para tal fin. Es obligatorio enviar una API-Key válida.

        El campo `irsId` debe ser, además, un NIF/NIE/CIF español sintácticamente válido (dígito o
        letra de control correcto); en caso contrario se rechaza antes de consultar a la AEAT.

        El `Content-Type` de la petición no se comprueba: el servidor intenta interpretar el cuerpo
        como JSON independientemente de la cabecera enviada.

        ### Catálogo de códigos de error propios (HTTP 400)

        - **`000009`** — Falta `irsId` o `name` en el cuerpo de la petición.
        - **`000010`** — `irsId` no es un NIF/NIE/CIF español sintácticamente válido.
        - **`000011`** — `name` está vacío.
        - **`000013`** — El par NIF/nombre no coincide según la AEAT, **o** ha fallado la comunicación con su servicio de contraste (ambos casos son indistinguibles en la respuesta). Nota: este mismo código se usa también, con otro significado, en la capa común de autenticación (bloqueo por IP) — ver la introducción de esta documentación.

        Si la petición falla en una capa previa a esta operación (por ejemplo, demasiados segmentos en
        la URL, o licencia/POA de la compañía), la respuesta 400 no sigue el schema `IdCheckError` sino
        el schema genérico `Error` (con `code` numérico en esos casos concretos).
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdCheckRequest'
            examples:
              ejemplo:
                summary: Petición de contraste
                value:
                  irsId: "12345678Z"
                  name: "Nombre Apellido Ejemplo"
      responses:
        '200':
          description: Par NIF–nombre/razón social válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdCheckResponse'
        '400':
          description: Par inválido o error de validación de entrada (ver catálogo de códigos arriba, en la descripción de la operación).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/IdCheckError'
                - $ref: '#/components/schemas/Error'
        '404':
          description: Verbo HTTP no soportado en esta ruta (solo se admite POST). Respuesta sin cuerpo.
        '503':
          description: Servicio no disponible temporalmente (mantenimiento) o error de conexión/concurrencia en base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: API-Key
  schemas:
    IdCheckRequest:
      type: object
      required: [irsId, name]
      properties:
        irsId:
          type: string
          description: NIF/NIE/CIF español a contrastar. Debe ser sintácticamente válido (dígito/letra de control correcto).
          example: "12345678Z"
        name:
          type: string
          description: Nombre completo o razón social asociada.
          example: "Nombre Apellido Ejemplo"
    IdCheckResponse:
      type: object
      properties:
        message:
          type: string
          enum: [Valid]
          description: Indica que el par NIF–nombre/razón social es correcto.
        requestId:
          type: string
          description: Identificador de la solicitud para trazabilidad.
      example:
        message: "Valid"
        requestId: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    IdCheckError:
      type: object
      properties:
        message:
          type: string
          description: Descripción del error. "Invalid" para el caso de contraste fallido; otros mensajes para errores de validación de entrada (ver catálogo de códigos de la operación).
        code:
          type: string
          description: Código de error de negocio propio de esta operación. Ver catálogo en la descripción de la operación.
        requestId:
          type: string
          description: Identificador de la solicitud para trazabilidad.
      example:
        message: "Invalid"
        code: "000013"
        requestId: "ffffffff-1111-2222-3333-444444444444"
    CrearFacturaRequest:
      type: object
      required:
      - invoice
      properties:
        invoice:
          $ref: '#/components/schemas/Factura'
    Factura:
      type: object
      description: Modelo de factura (referencia).
      required:
      - id
      - type
      - vatLines
      - total
      - amount
      properties:
        recipient:
          $ref: '#/components/schemas/Destinatario'
        id:
          $ref: '#/components/schemas/IdentificadorDocumento'
        type:
          type: string
          enum:
          - F1
          - F2
          - F3
          - R1
          - R2
          - R3
          - R4
          - R5
        replacesTicket:
          type: boolean
          description: 'Aceptado por la API, pero sin efecto en el procesamiento actual (la sustitución de tickets se determina por `type=F3` + `replacedTicketIds`).'
        replacedTicketIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IdentificadorDocumento'
          description: Obligatorio cuando `type` es `F3`.
        creditNote:
          $ref: '#/components/schemas/NotaRectificativa'
        simple:
          type: boolean
          description: Aceptado por la API, pero sin efecto en el procesamiento actual (el tratamiento de factura simplificada se determina por el `type`, p.ej. `F2`/`R5`).
        description:
          $ref: '#/components/schemas/DescripcionFactura'
        vatLines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LineaIVA'
        amount:
          type: number
          description: Cuota total de IVA de la factura. Se valida con una tolerancia de 1 unidad contra la suma de las líneas de `vatLines`; el importe efectivamente registrado ante la AEAT (XML y hash de encadenamiento) se recalcula siempre a partir de `vatLines`, no a partir de este valor literal.
        total:
          type: number
          description: Importe total de la factura. Misma validación y recálculo que `amount` (tolerancia de 1 unidad; el valor real ante la AEAT se recalcula de `vatLines`).
        issuedBy:
          $ref: '#/components/schemas/EmisionPor'
        isFix:
          type: boolean
          description: Subsanación de una factura previa. Permite reenviar una factura con la misma clave (NIF emisor + número + año) que ya existe localmente sin que se rechace como duplicada, y determina automáticamente el indicador de rechazo previo (`RechazoPrevio`) que se envía a la AEAT a partir del histórico local de envíos de esa factura.
    Destinatario:
      description: >
        Identificación del destinatario. Se modela como una de estas dos formas excluyentes,
        según el tipo de identificador disponible.
      oneOf:
      - $ref: '#/components/schemas/DestinatarioPorNif'
      - $ref: '#/components/schemas/DestinatarioPorId'
    DestinatarioPorNif:
      title: DestinatarioPorNif
      description: Destinatario identificado por NIF/NIE/CIF español.
      type: object
      required:
      - irsId
      - name
      properties:
        irsId:
          type: string
        name:
          type: string
        country:
          $ref: '#/components/schemas/CodigoPais'
          description: Opcional en esta forma.
    DestinatarioPorId:
      title: DestinatarioPorId
      description: Destinatario identificado por un documento distinto de NIF/NIE/CIF español (p.ej. extranjero, o pasaporte).
      type: object
      required:
      - id
      - idType
      - name
      - country
      properties:
        id:
          type: string
        idType:
          $ref: '#/components/schemas/TipoIdFiscal'
        name:
          type: string
        country:
          $ref: '#/components/schemas/CodigoPais'
    IdentificadorDocumento:
      type: object
      required:
      - number
      - issuedTime
      properties:
        number:
          oneOf:
          - type: string
          - type: integer
        issuedTime:
          type: string
          format: date
    DescripcionFactura:
      type: object
      required:
      - text
      properties:
        text:
          type: string
        operationDate:
          type: string
          format: date
    NotaRectificativa:
      type: object
      required:
      - style
      - ids
      description: Si `style` es `S` (sustitutiva), `creditBase` y `creditVat` son además obligatorios.
      properties:
        style:
          type: string
          enum:
          - S
          - I
        ids:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IdentificadorDocumento'
        creditBase:
          type: number
        creditVat:
          type: number
        creditRecharge:
          type: number
    EmisionPor:
      type: object
      required:
      - type
      description: 'Si `type` es `T` (por terceros), `issuer` es obligatorio por regla de negocio (código `561186`). Ver nota sobre `issuedBy.type=T` en la descripción de la operación POST /invoice.'
      properties:
        type:
          type: string
          enum:
          - T
          - D
        issuer:
          $ref: '#/components/schemas/Destinatario'
    LineaIVA:
      type: object
      required:
      - base
      - rate
      - vatOperation
      - vatKey
      properties:
        base:
          type: number
        rate:
          type: integer
          description: 'Tipo impositivo. Cuando el impuesto es IVA (`tax` ausente o `01`), solo se admiten los valores 0, 4, 5, 10 o 21 (código de error `561124` en caso contrario).'
        amount:
          type: number
        rate2:
          type: number
          description: Tipo de recargo de equivalencia. Solo se admiten los valores 5.2, 1.4, 0.5 o 0.
        amount2:
          type: number
        vatOperation:
          oneOf:
          - $ref: '#/components/schemas/TipoOperacionIVA'
          - $ref: '#/components/schemas/MotivoExencionIVA'
        vatKey:
          $ref: '#/components/schemas/ClaveRegimenIVA'
        isUsingSimplifiedRegime:
          type: boolean
          description: Aceptado por la API, pero sin efecto en el procesamiento actual.
        tax:
          $ref: '#/components/schemas/CodigoImpuesto'
    CodigoImpuesto:
      type: string
      description: 'Código de impuesto. Por defecto (si se omite) se asume IVA (''01'').'
      enum:
      - '01'
      - '02'
      - '03'
      - '05'
    DatosVerifactu:
      type: object
      properties:
        qrcode:
          type: string
          description: data URL PNG. Cadena vacía si esta respuesta corresponde a una anulación.
          example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAAB4CAYAAAAoaKA8AAAAAXNSR0IArs4c6QAAAARnQU1BAAC...
        chainInfo:
          $ref: '#/components/schemas/IdentificadorFacturaPrevio'
        verifactuXml:
          type: string
          description: XML en base64
          example: PHN1bTE6UmVnaXN0cm9BbHRhIHhtbG5zOnN1bTE9Imh0dHBzOi8vd3d3Mi5hZ2VuY2lhdHJpYnV0YXJpYS5nb2IuZXMv...
        verifactuUrl:
          type: string
          description: URL de verificación (la misma que codifica el código QR). Cadena vacía si esta respuesta corresponde a una anulación.
          example: https://prewww2.aeat.es/wlpl/TIKE-CONT/ValidarQR?nif=B13674197&numserie=A-000001&fecha=21-07-2025&importe=12.10
        queueId:
          description: 'Identificador interno de la factura/anulación. Se emite como texto en las respuestas de creación (`POST /invoice`) y anulación (`POST /invoice_cancel`); como número en `POST /invoice_data/{id}`.'
          oneOf:
          - type: string
          - type: integer
          example: '44'
        requestId:
          type: string
          example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
    InvoiceDataResponse:
      allOf:
      - $ref: '#/components/schemas/DatosVerifactu'
      - type: object
        properties:
          originalRequestId:
            type: string
            format: uuid
            description: Identificador de la petición original que generó esta factura o anulación.
            example: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    IdentificadorFacturaPrevio:
      type: object
      properties:
        issuerIrsId:
          type: string
          example: B13674197
        number:
          type: string
          example: A-000001
        issuedTime:
          type: string
          format: date-time
          description: Incluye hora y offset horario (siempre 00:00:00 del día correspondiente).
          example: '2025-07-21T00:00:00+02:00'
        hash:
          type: string
          example: 1B345A165A7F99610AD75B135C8DCDE197AD353BD6E840E53733FD66C5B76264
    EstadoFactura:
      type: object
      properties:
        state:
          type: string
          description: '`cancel` está reservado pero no se emite actualmente: anular una factura no cambia el `state` de la factura original consultada por este endpoint. Cualquier valor interno no reconocido se reporta como `pending`.'
          enum:
          - pending
          - sent
          - cancel
          - error
          example: sent
        requestId:
          type: string
          example: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
        error_code:
          type: string
          description: Solo presente para determinadas cuentas. Código de error informado por la AEAT en el registro de facturación, si lo hay.
        error_text:
          type: string
          description: Solo presente para determinadas cuentas. Descripción del error informado por la AEAT, si lo hay.
        aeat_registered:
          type: boolean
          description: Solo presente para determinadas cuentas. Indica si la AEAT ha registrado la factura.
    Error:
      type: object
      description: El campo `code` no es único globalmente entre endpoints — el mismo valor puede representar causas distintas según la operación (ver el catálogo propio de cada una).
      properties:
        code:
          description: Código de error interno. Puede llegar como texto o como número según el punto del código que lo generó.
          oneOf:
          - type: string
          - type: integer
          example: '1GQ3QH'
        message:
          type: string
          example: Valor no permitido en 'invoice/type'
        requestId:
          type: string
          description: Identificador de la petición, útil para soporte. Puede estar ausente en errores producidos antes de la autenticación (503, JSON mal formado).
          example: 79cbcf2a-3811-49f4-9466-a75f9e72b25c
    ServiceUnavailableError:
      type: object
      description: Respuesta de servicio no disponible (mantenimiento, o error de conexión/concurrencia con la base de datos). A diferencia de Error, no garantiza incluir 'requestId'.
      properties:
        code:
          description: '`000006`: mantenimiento programado. `3015`/`3016`: error de conexión o concurrencia con la base de datos.'
          oneOf:
          - type: string
          - type: integer
          example: 3015
        message:
          type: string
          example: Concurrency error. Try again later.
