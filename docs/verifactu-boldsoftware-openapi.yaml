openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Documentación API Veri*Factu
  version: 1.2.0
  description: |
    Permite crear, anular y consultar registros de facturación conformes a la especificación Veri*Factu*.
    Esta documentación sirve como referencia técnica y funcional para integraciones de terceros.

    Los ejemplos incluidos muestran distintos tipos de factura —simplificadas, rectificativas,
    exportación, intracomunitarias, autofacturas, subsanaciones...— junto con sus estructuras
    y respuestas esperadas.

    Todas las operaciones requieren autenticación mediante **API-Key** y devuelven respuestas
    en formato **JSON**.

    ## Autenticación

    La API-Key se envía en la cabecera `API-Key`. Opcionalmente se puede enviar también la cabecera
    `Verify-Issuer-Id` con el NIF que se espera que tenga la compañía autenticada; si no coincide,
    la petición se rechaza con el código `000007`.

    ## Códigos de respuesta HTTP

    Todas las respuestas de error de esta API —tanto de autenticación como de validación de negocio—
    devuelven **HTTP 400**, independientemente de la causa. Las únicas excepciones son:
    - **404**, sin cuerpo, si se usa un verbo HTTP distinto de `POST` sobre una ruta válida.
    - **503**, con el schema `ServiceUnavailableError`, si el servicio está en mantenimiento o hay un
      error de conexión con la base de datos.

    Los códigos `401`, `403` y `500` **no se producen actualmente** en ningún endpoint de esta API:
    no existe ningún escenario, incluidos los de autenticación o autorización, que devuelva esos
    estados.

    ## Errores comunes a todas las operaciones

    Antes de ejecutar la operación solicitada, toda petición pasa por una validación de autenticación
    compartida por los endpoints de esta documentación. Estos son los códigos que puede devolver esa
    capa común (siempre HTTP 400, salvo donde se indica):

    - **`000002`** — Falta la cabecera `API-Key`.
    - **`000003`** — La `API-Key` no tiene el formato esperado.
    - **`000005`** — La `API-Key` coincide con más de un registro interno (dato inconsistente; contactar soporte).
    - **`000008`** — La `API-Key` no existe.
    - **`000012`** — No se encuentra el usuario asociado a la compañía (contactar soporte).
    - **`000013`** — El origen (IP) de la petición no está autorizado. *(En `/id_check` este mismo código se reutiliza además para "el par NIF/nombre no coincide" — ver el catálogo propio de esa operación.)*
    - **`953443`** — La licencia de la compañía ha caducado.
    - **`953444`** — Falta recibir el justificante de alta (POA) de la compañía.
    - **`000007`** — Se envió la cabecera opcional `Verify-Issuer-Id` y no coincide con el NIF de la compañía autenticada.
    - **`000001`** — La ruta solicitada no está reconocida por la API (revisar la URL).
    - **`3017-B`** — Error interno no controlado durante el procesamiento de la petición.

    Nota: el campo `code` de estas respuestas no es necesariamente el mismo tipo JSON (texto o número)
    en todos los casos — ver la descripción del schema `Error`.
servers:
- url: https://vf1.boldsoftware.es/v1
security:
- ApiKeyAuth: []
tags:
- name: Facturas
  description: Endpoints disponibles para operar con registros de facturación
- name: Utilidades
  description: Endpoints auxiliares
paths:
  /invoice:
    post:
      tags:
      - Facturas
      summary: Crear una factura
      operationId: createInvoice
      description: |
        Crea un registro de facturación (alta de factura) en el sistema Veri*Factu.

        ### Catálogo de códigos de error de negocio (HTTP 400)

        Además de los errores comunes de autenticación (ver introducción de esta documentación),
        esta operación puede devolver los siguientes códigos propios:

        | code | Causa |
        |------|-------|
        | `1GQ3QH` | La petición no cumple el esquema JSON esperado (campo obligatorio ausente, tipo incorrecto, valor fuera de enum, propiedad no reconocida, etc.). Es el **mismo código para cualquier violación de esquema**: el campo concreto afectado se identifica por el texto de `message`, no por `code`. |
        | `3000` | Fecha inválida. |
        | `561112` | `issuedTime` está en el futuro. |
        | `561114` | Falta `creditNote` en una factura rectificativa. |
        | `561115` | Se envió `creditNote` sin que la factura sea rectificativa. |
        | `561116` | Falta `replacedTicketIds` en una factura de tipo `F3`. |
        | `561118` | Falta `creditBase` o `creditVat` cuando `creditNote.style` es `S`. |
        | `561123` | NIF/NIE/CIF de `recipient` inválido. |
        | `561125` | `operationDate` excesivamente futura. |
        | `561126` | Combinación no permitida de `country`/`idType` para destinatario español. |
        | `561127` | `rate2` fuera de los valores admitidos (5.2, 1.4, 0.5, 0). |
        | `561130` | Caracteres no imprimibles en `id.number`. |
        | `561133` / `561134` | `issuedTime` u `operationDate` anteriores a 20 años. |
        | `561143` | El signo de `base`/`amount` no es coherente. |
        | `561146` / `561147` / `561148` / `561149` | Reglas específicas de `vatKey` `14`/`15` (orden de fechas, tipo de factura admitido, destinatario admitido). |
        | `561150` | Suma superior a 3000 en factura simplificada (`F2`). |
        | `561152` | `issuedTime` anterior al 2024-07-01. |
        | `561158` | `issuedBy.type` es `D` sin informar `recipient`. |
        | `561160` | `rate`/`rate2` incompatibles entre sí. |
        | `561186` | `issuedBy.type` es `T` sin informar `issuer`. |
        | `561188` | El NIF de `issuedBy.issuer` coincide con el del emisor de la factura. |
        | `561189` / `561190` | `recipient` obligatorio o prohibido según el `type` de factura. |
        | `561193` | `recipient` coincide con el propio NIF del emisor sin tratarse de una autofactura. |
        | `561197` | `vatOperation` `S2` solo admitido en `F1`/`F3`/`R1`-`R4`. |
        | `561198` | `vatOperation` `S2` exige `rate` y `amount` iguales a 0. |
        | `561199` / `561200` / `561201` / `561203` / `561205` / `561206` | Restricciones de `vatOperation` según el `vatKey` informado. |
        | `561207` | `amount` distinto de 0 exige `vatOperation` `S1`. |
        | `561124` | `rate` fuera de [0, 4, 5, 10, 21] cuando el impuesto es IVA (`tax` ausente o `01`). |
        | `561142` | `amount` incoherente con `base` × `rate` (tolerancia de 10 unidades). |
        | `561208` | `vatOperation` `S1` exige `rate` y `amount` distintos de 0. |
        | `561211` | `issuedBy.issuer.idType` `07` no permitido. |
        | `561216` | `amount` (global) incoherente con la suma de las líneas de IVA (tolerancia de 1 unidad). |
        | `561210` | `total` (global) incoherente con la suma de las líneas de IVA (tolerancia de 1 unidad). |
        | `561237` | `vatOperation` `N1`/`N2` exige todos los importes a 0. |
        | `561252` | `vatKey` `08` exige `vatOperation` `N2`. |
        | `561100` | `description.text` vacío. |
        | `777001-C` | Error del servicio de verificación de NIF intracomunitario (VIES). |
        | `777001-B` | El NIF no coincide con el registrado en VIES. |
        | `777002-B` | Se informó `replacedTicketIds` sin que la factura sea de tipo `F3`. |
        | `405530` / `031916` / `519126` / `169439` | Datos obligatorios del destinatario extranjero incompletos. |
        | `B113047` | Ya existe una factura con el mismo NIF emisor + número de serie (normalizado) + año de emisión, y la petición no es una subsanación (`isFix: true`). La comprobación es específica del entorno (sandbox/producción no se cruzan). |
        | `397430` | El destinatario no ha podido identificarse en el servicio de la AEAT. |
        | `5AXUFV` | No se ha podido determinar el sistema informático (SIF) de la compañía. |

        Nota: `issuedBy.type: T` (autofactura por terceros) está deshabilitado actualmente en el
        servidor; cualquier petición con ese valor devuelve un error no incluido en la tabla anterior.
        Está pendiente de habilitación — consultar con BOLD antes de integrarlo.
      security:
      - ApiKeyAuth: []
