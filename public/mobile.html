<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ops · Mobile</title>
<meta name="theme-color" content="#171717" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ops" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/ops-mark.svg" />
<link rel="icon" href="assets/ops-mark.svg" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/mobile-home.css" />
</head>
<body>
  <header class="app-header">
    <span style="font-weight:800; letter-spacing:0.03em; color:#fff;">Ops</span>
    <div class="app-header__user">
      <span id="userName">Signed in</span>
      <div class="avatar" id="userAvatar">?</div>
    </div>
  </header>

  <main class="mh-shell">
    <h1 class="mh-title" data-i18n="mhome.title">What do you need?</h1>

    <div class="mh-grid">
      <a class="mh-tile" href="pages/mobile-expenses.html" id="mhExpensesTile">
        <div class="mh-tile__icon" aria-hidden="true">📷</div>
        <div class="mh-tile__label" data-i18n="mhome.scanTickets">Scan tickets</div>
        <span class="mh-tile__status hidden" id="mhExpensesStatus"></span>
      </a>

      <div class="mh-tile mh-tile--soon" aria-disabled="true">
        <div class="mh-tile__icon" aria-hidden="true">🕒</div>
        <div class="mh-tile__label" data-i18n="mhome.clockInOut">Clock in / out</div>
        <span class="mh-tile__status mh-tile__status--soon" data-i18n="welcome.status.soon">Coming soon</span>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/branding.js"></script>
  <script src="js/i18n-dict.js"></script>
  <script src="js/i18n.js"></script>
  <script src="vendor/oidc-client-ts.min.js"></script>
  <script src="vendor/msal-browser.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/usermenu.js"></script>
  <script src="js/mobile-home.js"></script>
</body>
</html>
