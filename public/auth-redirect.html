<!--
  MSAL popup/silent redirect landing page — intentionally empty.

  This is the redirectUri used by js/auth.js's loginPopup() call (see
  js/config.js MSAL.redirectUri). It must be registered as the redirect URI
  under the "Single-page application" platform on the Entra app registration.

  MSAL.js completes a popup sign-in entirely from the OPENER window's side:
  it polls this popup's location for the #code=... hash and closes the
  popup itself once it sees it — no script here needs to run at all. This
  page deliberately does NOT load index.html's app bundle (config.js,
  msal-browser.min.js, auth.js, ...): loading the full app inside the
  popup was causing it to render the whole "Sign in" page again instead of
  closing quickly, which both looked broken and let a user click "Sign in"
  a second time from inside the popup (MSAL's block_nested_popups error).
  Keeping this page empty means the popup has nothing to do but sit still
  for the split second before the opener closes it.
-->
</body>
</html>
