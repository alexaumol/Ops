<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Time allocation · HITT Ops</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/business-partners.css" />
<link rel="stylesheet" href="../css/time-allocation.css" />
</head>
<body>
  <header class="app-header">
    <a class="app-header__brand" href="../welcome.html">HITT<span class="dot">·</span>Ops</a>
    <nav class="app-header__nav" aria-label="Primary">
      <a href="../welcome.html">Home</a>
      <a href="time-allocation.html" class="active">Time allocation</a>
    </nav>
    <div class="app-header__user">
      <span id="dataSourcePill" class="data-pill" style="font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px;">…</span>
      <div class="avatar" id="userAvatar">?</div>
      <span id="userName">Signed in</span>
      <button class="btn btn-secondary" id="btnSignOut" style="padding:0.35rem 0.75rem; font-size:0.8rem;">Sign out</button>
    </div>
  </header>

  <main class="page-shell">
    <h1 class="page-title">Time allocation</h1>
    <p class="page-subtitle">Log your hours against projects, week by week.</p>

    <div class="ta-banner">
      <label for="employeeSelect">Logging time as</label>
      <select id="employeeSelect"></select>

      <div class="ta-spacer"></div>

      <div class="ta-week-nav">
        <button id="btnWeekBack" title="Previous week">‹</button>
        <input id="weekPicker" type="week" />
        <button id="btnWeekForward" title="Next week">›</button>
      </div>
      <span id="weekTotal" class="ta-total">0h logged</span>
    </div>

    <div class="ta-table-wrap">
      <table class="ta-table">
        <thead>
          <tr>
            <th>Project</th>
            <th>Status</th>
            <th>Resource type</th>
            <th style="text-align:right;">Hours</th>
            <th>Last update</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="taTableBody"></tbody>
      </table>
      <div id="taEmpty" class="bp-empty hidden">No projects logged for this week yet.</div>
      <div class="ta-add-row">
        <button class="btn btn-secondary" id="btnAddProject">+ Add project</button>
      </div>
    </div>
  </main>

  <div id="toastHost" class="toast-host"></div>

  <!-- ============================ PROJECT PICKER MODAL ============================ -->
  <div id="projectPickerOverlay" class="modal-overlay hidden">
    <div class="modal-panel modal-panel--sm">
      <div class="modal-head">
        <h2 style="flex:1; font-size:1rem; font-weight:700; color:#fff; margin:0;">Add a project</h2>
        <button id="projectPickerClose" class="modal-head-btn modal-head-btn--close" title="Close">✕</button>
      </div>
      <div style="padding: 0.75rem 1.1rem; border-bottom:1px solid var(--border-subtle);">
        <input id="projectPickerSearch" type="text" placeholder="Search by project code or name…" class="field-input" autocomplete="off" />
      </div>
      <div id="projectPickerResults" class="modal-body" style="max-height:50vh;"></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/time-allocation.js"></script>
</body>
</html>
